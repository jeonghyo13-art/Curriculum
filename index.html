    "2022 기초소양 (디지털)|2022 개정 교육과정에서 언어, 수리와 함께 모든 교과 학습의 기반으로 새롭게 도입된 기초소양은?|디지털 소양|예술 소양|외국어 소양|체육 소양|정보 교과뿐 아니라 국어, 수학 등 모든 과목에 에듀테크와 AI 리터러시를 녹여내야 합니다.|AI 디지털 교과서 등 미래 교육 환경에 적응하기 위해 전 교과 차원의 '디지털 소양' 교육이 필수입니다.|기초소양=디지털소양",
    "생태전환교육|2022 개정 교육과정 총론에서 기후위기와 지속가능한 미래 대응을 위해 전 교과에서 다루도록 신설 강화한 교육은?|생태전환교육|통일교육|안전교육|경제교육|단순한 환경보호를 넘어 인간과 자연의 공존을 위한 세계관과 생활 양식의 근본적 전환을 촉구합니다.|중핵 교육과정이나 탈학문적 설계를 활용하여 지역사회 연계 '생태전환 프로젝트'를 구안하세요.|생태전환=지속가능/기후대응",
    "학교자율시간|2022 개정 교육과정에서 지역/학교 여건과 학생 필요에 따라 다양한 과목(활동)을 학교가 직접 신설·운영할 수 있게 한 제도는?|학교자율시간|자유학기제|방과후학교|계절학기|국가 교육과정을 기계적으로 따르지 않고, 학교가 교육과정의 진짜 주인이 되는 분권화의 상징입니다.|스킬벡 모형(상황분석)을 적용하여 우리 학교만의 특색 있는 '학교자율시간' 모듈을 개발해야 합니다.|자율시간=과목신설/학교권한"
];

const allData = [];
rawStrData.forEach((dataStr, index) => {
    const parts = dataStr.split('|');
    allData.push({
        id: index + 1,
        topic: parts[0],
        type: "multiple",
        q: parts[1],
        accepted: [parts[2]],
        a: parts[2],
        choices: [parts[2], parts[3], parts[4], parts[5]],
        exp: parts[6],
        tip: parts[7],
        m: parts[8]
    });
});

const setMetadata = [
    { id: 1, title: "제1세트: 교육과정의 기초와 유형", desc: "공식적, 잠재적, 영, 숨겨진 교육과정, 교과중심 설계 (1~20번)" },
    { id: 2, title: "제2세트: 경험/학문중심 및 설계 원리", desc: "경험중심(생성/중핵), 학문중심(지식의 구조), 통합(드레이크) (21~40번)" },
    { id: 3, title: "제3세트: 타일러/타바 개발 모형", desc: "조직 원리(계열/통합/계속), 타일러 합리적 모형, 타바 귀납적 모형 (41~60번)" },
    { id: 4, title: "제4세트: 스킬벡/백워드/아이즈너 모형", desc: "SBCD, 위긴스 백워드(평가선행), 워커 숙의, 아이즈너 참평가 (61~80번)" },
    { id: 5, title: "제5세트: 재개념화 및 2026 최신 트렌드", desc: "파이나 쿠레레, 스나이더 실행, 고교학점제, 2022개정 기초소양 등 (81~100번)" }
];

let sessionQuestions = [];
let currentQuestionIndex = 0;
let currentActiveSetId = 0; 

const els = {
    topTabs: document.getElementById('top-tabs'),
    viewHome: document.getElementById('view-home'),
    viewQuiz: document.getElementById('view-quiz'),
    setGrid: document.getElementById('set-grid'),
    quizHeaderTitle: document.getElementById('quiz-header-title'),
    qProgress: document.getElementById('q-progress'),
    qText: document.getElementById('q-text'),
    inputArea: document.getElementById('input-area'),
    feedbackArea: document.getElementById('feedback-area'),
    fbAlert: document.getElementById('fb-alert'),
    fbExp: document.getElementById('fb-exp'),
    fbM: document.getElementById('fb-m'),
    fbTip: document.getElementById('fb-tip'),
    actionBtn: document.getElementById('action-btn'),
    mainContent: document.getElementById('main-content')
};

const shuffle = (array) => {
    let curr = array.length, rand;
    while (curr !== 0) {
        rand = Math.floor(Math.random() * curr);
        curr--;
        [array[curr], array[rand]] = [array[rand], array[curr]];
    }
    return array;
};

function renderTopTabs() {
    let html = `<button onclick="showHomeView()" class="px-5 py-2.5 rounded-full font-bold text-sm transition-colors shadow-sm ${currentActiveSetId === 0 ? 'bg-indigo-600 text-white' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}">전체 세트 목록</button>`;
    
    setMetadata.forEach(set => {
        const isActive = currentActiveSetId === set.id;
        html += `<button onclick="startSet(${set.id})" class="px-5 py-2.5 rounded-full font-bold text-sm transition-colors ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}">${set.id}세트</button>`;
    });
    
    els.topTabs.innerHTML = html;
}

function renderHomeView() {
    let html = '';
    setMetadata.forEach(set => {
        html += `
        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between h-full">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <span class="bg-indigo-50 text-indigo-600 font-bold text-xs px-3 py-1 rounded-full">SET 0${set.id} - 20문항</span>
                    <span class="bg-gray-100 text-gray-500 font-bold text-xs px-3 py-1 rounded-full">순수 고유문항</span>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2 leading-tight">${set.title}</h3>
                <p class="text-sm text-gray-500 mb-6 leading-relaxed">${set.desc}</p>
            </div>
            <div class="flex justify-between items-center border-t border-gray-50 pt-4 mt-auto">
                <span class="text-xs text-gray-400 font-medium">객관식 4지선다 · 100% 셔플</span>
                <button onclick="startSet(${set.id})" class="text-indigo-600 font-bold text-sm flex items-center gap-1 hover:text-indigo-800 transition-colors">
                    세트 풀기 <span class="text-lg leading-none">→</span>
                </button>
            </div>
        </div>
        `;
    });
    els.setGrid.innerHTML = html;
}

function showHomeView() {
    currentActiveSetId = 0;
    els.viewQuiz.classList.add('hidden');
    els.viewHome.classList.remove('hidden');
    renderTopTabs();
    renderHomeView();
}

function startSet(setId) {
    currentActiveSetId = setId;
    const startIndex = (setId - 1) * 20;
    const endIndex = startIndex + 20;
    
    let targetQuestions = allData.slice(startIndex, endIndex);
    
    // 세트 진입 시마다 문항 순서 및 보기 순서 100% 무작위 셔플
    sessionQuestions = shuffle([...targetQuestions]);
    sessionQuestions.forEach(q => {
        q.choices = shuffle([...q.choices]);
    });

    currentQuestionIndex = 0;
    els.quizHeaderTitle.textContent = setMetadata.find(s => s.id === setId).title;
    
    els.viewHome.classList.add('hidden');
    els.viewQuiz.classList.remove('hidden');
    els.viewQuiz.classList.add('flex');
    
    renderTopTabs();
    renderQuestion();
}

let selectedMcqAns = "";

function renderQuestion() {
    els.feedbackArea.classList.add('hidden');
    els.feedbackArea.classList.remove('flex', 'animate-fade-in');
    els.mainContent.scrollTo({ top: 0, behavior: 'smooth' });
    
    const q = sessionQuestions[currentQuestionIndex];
    els.qProgress.textContent = `진행도: ${currentQuestionIndex + 1} / 20`;
    // 문제 앞의 파란색 키워드 태그 제거 (스포일러 방지)
    els.qText.textContent = q.q;

    els.actionBtn.textContent = "정답 확인하기";
    els.actionBtn.classList.remove('from-emerald-500', 'to-teal-600'); 
    els.actionBtn.onclick = checkAnswer;

    selectedMcqAns = "";
    els.inputArea.innerHTML = q.choices.map((choice, idx) => `
        <div class="mcq-option p-4 mb-3 border-2 border-gray-100 rounded-2xl cursor-pointer bg-white shadow-sm flex items-center gap-4 text-[1.1rem] font-medium text-gray-700 hover:bg-gray-50" data-ans="${choice}">
            <span class="w-9 h-9 rounded-full bg-gray-50 border border-gray-200 text-gray-400 flex items-center justify-center font-black text-sm pointer-events-none flex-shrink-0">${idx+1}</span>
            <span class="pointer-events-none flex-1 break-keep">${choice}</span>
        </div>
    `).join('');
    
    document.querySelectorAll('.mcq-option').forEach(el => {
        el.addEventListener('click', (e) => {
            document.querySelectorAll('.mcq-option').forEach(opt => opt.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            selectedMcqAns = e.currentTarget.getAttribute('data-ans');
        });
    });
}

function checkAnswer() {
    const q = sessionQuestions[currentQuestionIndex];
    
    if (!selectedMcqAns) {
        const options = document.querySelectorAll('.mcq-option');
        options.forEach(opt => { opt.style.transform = 'translateX(5px)'; setTimeout(()=> opt.style.transform='', 100); });
        return; 
    }
    
    const isCorrect = q.accepted.includes(selectedMcqAns);
    
    document.querySelectorAll('.mcq-option').forEach(el => {
        el.style.pointerEvents = 'none'; 
        if(q.accepted.includes(el.getAttribute('data-ans'))) {
            el.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-700', 'font-bold'); 
        } else if (el.classList.contains('selected') && !isCorrect) {
            el.classList.add('border-pink-400', 'bg-pink-50', 'text-pink-700'); 
        }
    });

    showFeedback(isCorrect, q);
}

function showFeedback(isCorrect, q) {
    els.feedbackArea.classList.remove('hidden');
    els.feedbackArea.classList.add('flex', 'animate-fade-in'); 
    
    if(isCorrect) {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200`;
        els.fbAlert.innerHTML = `🎉 완벽합니다! 정답입니다.`;
    } else {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-pink-100 text-pink-800 shadow-sm border border-pink-200`;
        els.fbAlert.innerHTML = `💡 아쉽습니다. 공식 정답은 <span class="text-pink-600 text-xl">[ ${q.a} ]</span> 입니다.`;
    }

    els.fbExp.innerHTML = q.exp;
    els.fbM.innerHTML = q.m;
    els.fbTip.innerHTML = q.tip;

    els.actionBtn.textContent = currentQuestionIndex < 19 ? "다음 문제로 이동 (Enter ⏎)" : "세트 종료 및 결과 보기";
    els.actionBtn.classList.add('from-emerald-500', 'to-teal-600');
    els.actionBtn.onclick = nextQuestion;
    
    setTimeout(() => {
        els.mainContent.scrollTo({ top: els.mainContent.scrollHeight, behavior: 'smooth' });
    }, 150);
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < sessionQuestions.length) {
        renderQuestion();
    } else {
        alert("해당 세트의 20문항을 모두 풀었습니다! 수고하셨습니다.");
        showHomeView();
    }
}

function setupEventListeners() {
    document.addEventListener('keydown', (e) => {
        if (currentActiveSetId === 0) return; 
        if (e.key === 'Enter') {
            if (els.actionBtn.textContent.includes('다음') || els.actionBtn.textContent.includes('종료')) els.actionBtn.click();
            else checkAnswer();
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    showHomeView();
    setupEventListeners();
});
</script>
</body>
</html>
