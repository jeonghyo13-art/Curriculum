    { id: 14, topic: "인간중심 교육과정", type: "short", q: "자아실현과 전인교육을 목적으로 하며, 교사와 학생 간의 진정성 있는 관계와 잠재적 교육과정을 매우 중시하는 사조는?", accepted: ["인간중심", "인간중심교육과정"], a: "인간중심 교육과정", exp: "인본주의 심리학의 영향을 받았으며, 평가보다 성장과 자아실현을 중시합니다.", tip: "AI 시대(하이테크)일수록, 정서적 유대와 공감을 바탕으로 하는 하이터치(High-Touch) 인간중심 교육의 중요성이 배가됩니다.", m: "인간중심: 자전잠 (자아실현, 전인교육, 잠재적)" },
    { id: 15, topic: "통합 교육과정", type: "multiple", q: "드레이크의 통합 유형 중, 학문의 독립성을 유지하면서 동일한 주제에 대해 여러 교과가 각자의 관점에서 다루는 방식은?", choices: ["간학문적 통합", "다학문적 통합", "탈학문적 통합", "상관형 통합"], accepted: ["다학문적 통합"], a: "다학문적 통합", exp: "가장 물리적인 결합입니다. (예: '환경' 주제를 국어, 과학, 사회에서 각기 다룸)", tip: "교사 간 물리적 협업이 어려운 환경에서는 전문적 학습공동체를 통해 '다학문적 통합'부터 단계적으로 시작하는 것이 좋습니다.", m: "드레이크: 다간탈 (다학문, 간학문, 탈학문)" },
    { id: 16, topic: "통합 교육과정", type: "short", q: "학문 간 경계를 완전히 허물고 실제 생활의 문제나 쟁점을 중심으로 교육과정을 조직하여 프로젝트를 적용하는 통합 방식은?", accepted: ["탈학문적", "탈학문적통합"], a: "탈학문적 통합", exp: "실생활 연계를 강조하며 과목의 구분이 의미가 없어집니다.", tip: "2026 융합형 인재 양성을 위해, 지역사회 문제를 해결하는 체인지메이커 동아리 활동 등에 탈학문적 통합을 적용할 수 있습니다.", m: "탈학문 = 교과초월 + 실생활 쟁점" },
    { id: 17, topic: "수평적 조직 원리", type: "short", q: "교육과정에서 특정 시기에 다루어야 할 내용의 폭(다양성)과 깊이를 결정하는 조직 원리는?", accepted: ["범위", "스코프", "scope"], a: "범위 (Scope)", exp: "무엇을 얼마나 가르칠 것인가에 대한 결정입니다.", tip: "학생의 적성과 진로가 다양해짐에 따라, 고교학점제 선택 과목의 범위(Scope)를 확장하여 선택권을 보장해야 합니다.", m: "수평적 원리: 범통균 (범위, 통합성, 균형)" },
    { id: 18, topic: "수직적 조직 원리", type: "short", q: "누적적이고 계속적인 학습을 위해 교육 내용을 단순에서 복잡한 것으로 점차 심화/확대되도록 배열하는 원리는?", accepted: ["계열성"], a: "계열성 (Sequence)", exp: "순서를 정하는 것으로, 학습 내용의 위계와 연관됩니다.", tip: "AI 진단평가를 통해 학습자의 인지 구조 내 위계를 파악하고, 계열성에 맞는 보충 학습을 제공해야 합니다.", m: "계열성 = 심화, 확대 (단순->복잡)" },
    { id: 19, topic: "수직적/수평적 조직 원리", type: "multiple", q: "이전에 배운 내용이 후속 학습의 출발점이 되도록 맞물리게 하거나(수직), 동일 학년의 교과들이 서로 관련성을 맺게 하는(수평) 원리는?", choices: ["계속성", "통합성", "연계성", "균형성"], accepted: ["연계성"], a: "연계성 (Articulation)", exp: "이음새를 매끄럽게 하는 것입니다. (예: 초6과 중1 간의 진로 연계)", tip: "자유학기제(중학교)와 고교학점제(고등학교) 사이의 '진로연계교육'을 통해 학교급 간 수직적 연계성을 강화해야 합니다.", m: "연계성 = 맞물림 (이음새)" },
    { id: 20, topic: "타일러 합리적 모형", type: "short", q: "타일러가 교육목표 설정 시 고려해야 할 3가지 원천(학습자, 사회, OOO) 중 빈칸에 들어갈 말은?", accepted: ["교과", "교과전문가"], a: "교과 (교과 전문가)", exp: "세 가지 원천의 요구를 분석하여 잠정적 교육목표를 도출합니다.", tip: "미래 사회 요구 분석(사회), 학생 특성 진단(학습자), 최신 학문 동향(교과)을 통합하여 타당한 교육목표를 수립합니다.", m: "타일러 3원천: 학사교" },
    { id: 21, topic: "타일러 합리적 모형", type: "multiple", q: "타일러 모형에서 잠정적 목표를 여과하여 최종 목표를 확정하는 2개의 체(Screen)는 무엇인가?", choices: ["교육사회학과 교육심리학", "교육철학과 학습심리학", "교육행정학과 교육철학", "교육과정학과 학습심리학"], accepted: ["교육철학과 학습심리학"], a: "교육철학과 학습심리학", exp: "철학은 가치(좋은 삶)를, 심리학은 도달 가능성(발달단계)을 걸러냅니다.", tip: "테크놀로지 맹신에서 벗어나, 학생의 인지 발달 단계(학습심리학)와 교육적 가치(교육철학)라는 체를 거쳐 에듀테크를 도입해야 합니다.", m: "타일러의 체: 철심" },
    { id: 22, topic: "학습경험 선정 원리", type: "short", q: "타일러의 학습경험 선정 원리 중, 하나의 교육목표 달성을 위해 다양한 학습경험을 제공할 수 있다는 원리는?", accepted: ["다경험", "다경험의원리"], a: "다경험의 원리", exp: "반대로 하나의 경험이 여러 성과를 내야 한다는 '다성과의 원리'도 있습니다.", tip: "개별화 학습(UDL)을 적용하여, 동일한 목표라도 학생의 흥미에 따라 다양한 과제(다경험의 원리)를 제공해야 합니다.", m: "선정 원리: 기만가다다 (기회, 만족, 가능, 다경험, 다성과)" },
    { id: 23, topic: "타바 단원개발 모형", type: "short", q: "타바 모형은 교사가 현장에서 수업 단원을 먼저 개발하고 이를 바탕으로 전체 교과 형성으로 나아가는 OOO 모형이다.", accepted: ["귀납적", "귀납", "풀뿌리"], a: "귀납적 (풀뿌리) 모형", exp: "타일러의 연역적/하향식과 대비되는 현장 중심의 상향식(Bottom-up) 모형입니다.", tip: "교사 수준의 교육과정 재구성 역량과 전문적 학습공동체(PLC)의 실천적 성격을 뒷받침하는 핵심 이론입니다.", m: "타바: 귀처현교 (귀납적, 처방적, 현장지향, 교사중심)" },
    { id: 24, topic: "타바 단원개발 모형", type: "multiple", q: "타바 모형의 가장 첫 번째 단계로, 학생들의 배경과 흥미를 파악하여 현장 적합성을 높이는 단계는?", choices: ["목표 설정", "요구 진단", "내용 선정", "시험적 교수단원 구성"], accepted: ["요구 진단"], a: "요구 진단", exp: "학습자의 구체적 요구와 실태를 진단하는 것에서 출발합니다.", tip: "학기 초 진단평가뿐만 아니라 학습 데이터 분석(LA)을 통한 정밀한 '요구 진단'이 학생 맞춤형 설계의 출발점입니다.", m: "타바 단계: 요목내선조..." },
    { id: 25, topic: "스킬벡 SBCD", type: "short", q: "스킬벡의 학교중심 교육과정 개발 모형에서 목표 설정 이전에 학교의 내적/외적 요인을 체계적으로 파악하는 핵심 1단계는?", accepted: ["상황분석", "상황"], a: "상황분석 (Situation Analysis)", exp: "외적 요인(사회, 학부모 등)과 내적 요인(학생 능력, 학교 시설 등)을 종합 분석합니다.", tip: "고교학점제 안정적 안착을 위해, 단위 학교는 가용할 수 있는 인적/물적 자원 인프라를 면밀히 '상황 분석'해야 합니다.", m: "스킬벡: 상목프판평" },
    { id: 26, topic: "백워드 설계", type: "short", q: "위긴스와 맥타이의 백워드 모형에서, 학습 내용과 수업 활동을 계획하기 전에 선행하여 수립해야 하는 것은 OOOO이다.", accepted: ["평가계획", "평가"], a: "평가 계획 (수용할 만한 이해의 증거 결정)", exp: "목표 설정 -> 평가 계획 -> 수업 계획 순으로 진행되어 일체화를 도모합니다.", tip: "과정 중심 평가와 성취평가제가 중시되는 2026 교육 현장에서, 백워드 설계는 평가의 타당도를 보장하는 강력한 도구입니다.", m: "백워드 순서: 바수학" },
    { id: 27, topic: "백워드 설계 - 영속적 이해", type: "multiple", q: "백워드 설계가 목표로 하는 '영속적 이해(Enduring Understanding)'의 6가지 측면이 아닌 것은?", choices: ["설명", "공감", "적용", "기계적 암기"], accepted: ["기계적 암기"], a: "기계적 암기", exp: "이해의 6측면: 설명, 해석, 적용, 관점, 공감, 자기지식. 단순 사실 암기를 넘어선 전이 가능한 이해를 뜻합니다.", tip: "논서술형 평가(IB 등)에서 학생에게 요구하는 핵심 역량이 바로 다각도로 지식을 활용하는 '영속적 이해' 능력입니다.", m: "이해 6측면: 설해적 관공자" },
    { id: 28, topic: "워커 숙의 모형", type: "short", q: "워커의 자연주의적 모형에서, 개발자들이 각자의 신념, 가치, 개념을 공유하며 공감대를 형성하는 기초 단계를 무엇이라 하는가?", accepted: ["강령", "강령단계", "platform"], a: "강령 (Platform)", exp: "서로의 입장을 확인하고 합의의 토대를 마련하는 첫 단계(강령->숙의->설계)입니다.", tip: "교육과정 위원회나 교직원 회의에서 민주적 의사결정을 하려면, 서로의 철학을 공유하는 '강령' 형성 단계가 필수입니다.", m: "워커 3단계: 강숙설" },
    { id: 29, topic: "워커 숙의 모형", type: "multiple", q: "워커 모형의 '숙의(Deliberation)' 단계에 대한 설명으로 옳은 것은?", choices: ["미리 정해진 최적의 단일 대안을 수용한다.", "대안을 탐색하고 토의하여 실행 가능한 합의를 이끌어낸다.", "상황 분석을 객관적 지표로 수량화한다.", "학습자의 요구만을 단독으로 수렴한다."], accepted: ["대안을 탐색하고 토의하여 실행 가능한 합의를 이끌어낸다."], a: "대안 탐색 및 타협(합의)", exp: "현실의 복잡성을 인정하고, 다양한 대안 중 최선의 것을 치열한 토의로 타협해 나가는 과정입니다.", tip: "학교 특색 과목 개설 등 갈등 요소가 있는 사안에서 교사 공동체의 치열한 '숙의' 과정이 요구됩니다.", m: "숙의 = 논쟁, 대안 검토, 타협" },
    { id: 30, topic: "아이즈너 예술적 모형", type: "short", q: "아이즈너가 제안한 목표로, 문제와 조건은 명확하게 주어지지만 정답이 하나가 아니라 여러 가지 해결책이 나올 수 있는 목표는?", accepted: ["문제해결목표", "문제해결"], a: "문제해결목표", exp: "행동목표의 획일성을 비판하며 창의적 문제해결을 유도하기 위해 고안되었습니다.", tip: "미래 사회 창의성 함양을 위해 생성형 AI 프롬프팅을 활용한 과제와 같은 다답형 '문제해결목표'를 수업에 반영해야 합니다.", m: "아이즈너 목표: 행문표 (행동, 문제해결, 표현적결과)" },
    { id: 31, topic: "아이즈너 예술적 모형", type: "short", q: "사전에 목표를 정하지 않고, 어떤 교육 활동을 하는 도중이나 끝난 후에 얻게 되는 교육적으로 바람직한 결과를 의미하는 것은?", accepted: ["표현적결과", "표현적목표", "표현적"], a: "표현적 결과 (Expressive Outcome)", exp: "미술관 견학 후 학생마다 인상 깊었던 점이 다르듯, 활동의 산물로서의 목표입니다.", tip: "학생 주도형 프로젝트나 진로 체험 활동의 성과를 진술할 때 '표현적 결과'의 관점이 매우 유용합니다.", m: "표현적 결과 = 무목표, 활동 후 형성" },
    { id: 32, topic: "아이즈너 예술적 모형", type: "multiple", q: "학생들 간의 미묘한 성취 차이를 질적으로 감지하는 교사의 감상 능력을 일컫는 아이즈너의 개념은?", choices: ["교육비평", "교육적 감식안", "참평가", "교육적 상상력"], accepted: ["교육적 감식안"], a: "교육적 감식안 (Connoisseurship)", exp: "마치 와인 감별사처럼 학생 성취의 질적 차이를 알아보는 교사의 개인적, 사적인 감지 능력입니다.", tip: "AI가 제공하는 정량적 학습 데이터(대시보드) 이면에 있는 학생의 태도와 서사를 읽어내는 역량이 '교육적 감식안'입니다.", m: "감식안(사적 감지) vs 비평(공적 표현)" },
    { id: 33, topic: "아이즈너 예술적 모형", type: "short", q: "교사가 교육목표와 내용을 학생에게 적합한 형태로 다양하게 변형하여 의미 있는 학습 기회를 제공하는 능력을 무엇이라 하는가?", accepted: ["교육적상상력", "상상력"], a: "교육적 상상력", exp: "학생의 시각에서 은유, 직유, 다양한 매체를 활용하여 수업을 다채롭게 구성하는 예술적 기예입니다.", tip: "에듀테크 툴이나 메타버스 환경을 창의적으로 구성하여 학생의 동기를 유발하는 것도 현대적 '교육적 상상력'의 발현입니다.", m: "교육적 상상력 = 내용의 적절한 변형 능력" },
    { id: 34, topic: "파이나 실존적 재개념화", type: "short", q: "파이나가 제안한 것으로, 개인의 교육적 경험을 회귀-진보-분석-종합하여 자아 반성적 삶을 살게 하는 실존적 탐구 방법은?", accepted: ["쿠레레", "currere", "쿠레레방법론"], a: "쿠레레 (Currere) 방법론", exp: "교육과정을 명사(정해진 코스)가 아닌 동사(달리는 경험 그 자체)로 재해석하여 개인의 실존적 각성을 돕습니다.", tip: "자기주도적 진로 설계 과정에서 학생이 자신의 삶을 성찰하고 의미를 부여하는 쿠레레적 자서전 쓰기를 적극 권장합니다.", m: "쿠레레 4단계: 회진분종" },
    { id: 35, topic: "파이나 쿠레레", type: "short", q: "쿠레레 4단계 중 자유 연상을 통해 현재 내재된 미래의 자신의 모습을 상상해 보는 단계는?", accepted: ["진보", "진보단계", "progressive"], a: "진보 (Progressive)", exp: "회귀(과거) -> 진보(미래) -> 분석(현재) -> 종합(통합) 순으로 이루어집니다.", tip: "불확실성이 큰 미래 사회에서 학생 스스로 미래 자아상(진보)을 구체화해보는 진로 탄력성 교육이 필수입니다.", m: "진보 = 미래 상상" },
    { id: 36, topic: "스나이더 실행 모형", type: "multiple", q: "교사가 외부(국가)에서 개발된 교육과정을 학교의 맥락과 자신의 특성에 맞게 적극적으로 조정하여 실행하는 관점은?", choices: ["충실도 관점", "상호적응적 관점", "생성적 관점", "자서전적 관점"], accepted: ["상호적응적 관점"], a: "상호적응적 관점 (Mutual Adaptation)", exp: "개발자와 실행자 간의 조정과 변화를 중시하며, 오늘날 가장 현실적으로 요구되는 관점입니다.", tip: "교사는 국가 수준의 성취기준을 준수하되, AI 등 에듀테크 환경과 학급 실태에 맞게 '상호적응적'으로 수업을 재구성해야 합니다.", m: "스나이더: 충상생 (충실, 상호적응, 생성)" },
    { id: 37, topic: "스나이더 실행 모형", type: "short", q: "교사와 학생이 수업 현장에서 공동의 주체로서 교육경험을 현장에서 함께 만들어가는 실행 관점은?", accepted: ["생성적관점", "생성적"], a: "생성적 관점", exp: "교사는 단순 실행자가 아니라 학생과 함께 교육과정을 창조하는 개발자 역할을 수행합니다.", tip: "2022 개정 교육과정이 지향하는 '학습자 주도성(Student Agency)'이 가장 극대화된 실행 관점입니다.", m: "생성적 = 교사+학생 공동 창조" },
    { id: 38, topic: "홀 CBAM", type: "short", q: "교사의 관심에 기초한 채택 모형(CBAM)에서 새로운 교육과정 정착을 위해 교사의 관심 단계(0~6단계)에 맞게 무엇을 제공해야 하는가?", accepted: ["맞춤형연수", "교사연수", "연수", "맞춤형지원"], a: "맞춤형 연수 (차별화된 지원)", exp: "교사의 관심과 실행 수준을 진단하여 그에 맞는 맞춤형 연수와 피드백을 제공해야 성공적으로 혁신이 안착합니다.", tip: "AI 디지털 교과서(AIDT) 도입 시 교사들의 심리적 저항을 줄이려면 CBAM 기반의 맞춤형 연수 체계 설계가 핵심입니다.", m: "CBAM 진단: 관실형 (관심수준, 실행수준, 실행형태)" },
    { id: 39, topic: "교육과정 재구성", type: "multiple", q: "렌줄리가 고안한 전략으로, 상위 학습자를 위해 이미 숙달한 내용의 반복을 피하고 기본 교육과정을 압축하여 남는 시간에 심화 과제를 제공하는 것은?", choices: ["교육과정 압축", "중획 교육과정", "나선형 교육과정", "블록타임제"], accepted: ["교육과정 압축"], a: "교육과정 압축 (Compacting)", exp: "시간을 절약(속진)하여 다양한 심화 탐구 기회를 제공함으로써 영재 학생의 지루함을 방지합니다.", tip: "다양한 수준의 학생이 섞인 통합 교실에서 적응형 AI 튜터를 활용하면 효율적인 '교육과정 압축'과 개별 심화가 가능해집니다.", m: "압축 = 속진 + 심화 (상위 학습자 대상)" },
    { id: 40, topic: "편성 및 운영", type: "short", q: "특정 과목의 수업을 1년 내내 하지 않고, 한 학기나 특정 시기에 몰아서 집중적으로 학습하여 이수하는 제도는?", accepted: ["집중이수제", "집중이수"], a: "집중이수제", exp: "한 학기에 배우는 과목 수를 줄여 학습 부담을 경감시키고 심도 있는 학습을 유도합니다.", tip: "고교학점제의 탄력적 학사 운영과 미이수 학생에 대한 단기 보충 과정을 운영하기 위해 집중이수제를 유연하게 활용할 수 있습니다.", m: "몰아서 이수 = 집중이수제" },
    { id: 41, topic: "편성 및 운영", type: "short", q: "기존의 45~50분 단위 수업을 2~3시간 연속으로 묶어서 운영하는 방식으로, 실험/실습이나 심층적 프로젝트에 적합한 시간 운영 방식은?", accepted: ["블록타임제", "블록타임"], a: "블록타임제", exp: "수업의 흐름이 끊기지 않아 토론이나 노작, 실습 중심의 학습에 유리합니다.", tip: "협력적 문제해결을 요하는 교과 융합 프로젝트(STEAM) 수업 설계 시 필수적으로 동반되어야 할 학사 운영 방식입니다.", m: "시간 묶기 = 블록타임제" },
    { id: 42, topic: "자유학기제", type: "short", q: "중학교 과정 중 한 학기를 지식경쟁 중심 평가에서 벗어나, 학생 참여형 수업과 과정 중심 평가를 실시하며 다양한 진로탐색 활동으로 운영하는 제도는?", accepted: ["자유학기제", "자유학기", "자유학년제"], a: "자유학기제", exp: "학생의 소질과 적성을 키우기 위한 맞춤형 교육과정입니다. (2022 개정부터는 1학년 1학기 권장)", tip: "자유학기(진로탐색) - 진로연계교육(중3-고1 전환기) - 고교학점제(진로설계)로 이어지는 종단적 진로 로드맵 구축이 중요합니다.", m: "자유학기 = 참여형 수업 + 진로 탐색 + 과정 평가" },
    { id: 43, topic: "교육과정 재구성", type: "short", q: "교사가 국가 교육과정 성취기준을 바탕으로 학급의 실태와 요구에 맞게 교육 내용, 교수 방법, 평가 방식을 조정하여 자신만의 수업 설계도를 수립하는 행위는?", accepted: ["교육과정재구성", "재구성", "학교교육과정재구성"], a: "교육과정 재구성", exp: "교사의 자율성과 전문성이 가장 적극적으로 발휘되는 실천적 영역입니다.", tip: "도구(에듀테크)를 단순히 도입하는 것을 넘어, 이를 활용해 수업을 학생 맞춤형으로 '재구성'하는 문해력이 미래 교사의 핵심 역량입니다.", m: "재구성 절차: 분석->유형결정->목/내/방/평 조정" },
    { id: 44, topic: "교과 간 재구성", type: "multiple", q: "특정 사회적 이슈(예: 기후 변화, AI 윤리)를 중심으로 과학, 사회, 도덕 등 여러 교과의 내용을 연계하거나 융합하여 공동 프로젝트 수업으로 진행하는 재구성 유형은?", choices: ["교과 내 재구성", "교과 간 재구성", "창체 연계 재구성", "집중이수 재구성"], accepted: ["교과 간 재구성"], a: "교과 간 재구성", exp: "범교과적 주제 학습이나 핵심 역량 증진을 위해 적용하며, 교사 간 협업이 매우 중요합니다.", tip: "민주시민 역량이나 생태전환교육 시 융합형 프로젝트 수업(교과 간 재구성)을 실천적 방안으로 강력히 제시할 수 있습니다.", m: "교과 간 = 다수 교과 융합(이슈/역량 중심)" },
    { id: 45, topic: "국가수준 교육과정", type: "short", q: "교육과정 결정 주체 중, 전국의 모든 학교가 공통으로 도달해야 할 교육목표와 성취기준의 큰 틀을 법적 가이드라인으로 제시하는 수준은?", accepted: ["국가수준", "국가수준교육과정", "국가"], a: "국가수준 교육과정", exp: "교육의 질적 통일성과 기회균등을 보장하지만, 지역이나 학교의 특수성을 온전히 반영하기 어렵다는 한계가 있습니다.", tip: "최근에는 국가수준의 큰 방향성(대강화) 속에서 지역 및 학교수준의 자율성을 극대화하는 '교육과정 분권화' 추세가 뚜렷합니다.", m: "국가수준 = 공통 기준, 기회 균등 보장" },
    { id: 46, topic: "2022 개정 - 핵심 역량", type: "multiple", q: "2022 개정 교육과정에서 핵심 역량 중 새롭게 이름이 바뀌고 강조된 것으로, 다원화된 사회에서 타인과 공감하고 문제를 해결해 나가는 역량은?", choices: ["의사소통 역량", "협력적 소통 역량", "공동체 역량", "자기관리 역량"], accepted: ["협력적 소통 역량"], a: "협력적 소통 역량", exp: "기존의 기능적 '의사소통 역량'이 포용성과 협력을 강조하는 미래 인성 함양 차원에서 확장되었습니다.", tip: "온라인 협업 툴(구글 문서, 패들렛 등)을 활용한 팀 프로젝트를 통해 '협력적 소통 역량' 신장 방안을 구체화하세요.", m: "2022 역량 6가지: 자지창심협공 (자기관리, 지식정보, 창의적사고, 심미적감성, 협력적소통, 공동체)" },
    { id: 47, topic: "2022 개정 - 기초소양", type: "multiple", q: "2022 개정 교육과정에서 모든 교과 학습의 기반이 되는 '3대 기초소양'으로 새롭게 설정된 것이 아닌 것은?", choices: ["언어 소양", "수리 소양", "디지털 소양", "시민 소양"], accepted: ["시민 소양"], a: "시민 소양", exp: "언어, 수리, 디지털 소양이 3대 기초소양입니다. 특히 디지털 소양이 전 교과에 걸쳐 강조됩니다.", tip: "정보 교과 시간에만 코딩을 배우는 것이 아니라, 국어나 사회 시간에도 데이터를 다루고 비판적으로 이해하는 '디지털 소양(리터러시)' 교육이 선행되어야 합니다.", m: "기초소양 3요소: 언수디 (언어, 수리, 디지털)" },
    { id: 48, topic: "2022 개정 - 학습자 주도성", type: "short", q: "2022 개정 교육과정의 총론적 기조로, 학생이 스스로 자신의 삶과 학습을 주도적으로 설계하고 이끌어가는 능력을 뜻하는 핵심 개념은?", accepted: ["학습자주도성", "주도성", "studentagency", "에이전시"], a: "학습자 주도성 (Student Agency)", exp: "포용성과 창의성을 갖춘 '주도적인 사람'을 기르는 것이 궁극적 목표입니다.", tip: "수업 설계 시 교사의 일방적 지시를 줄이고, 학습 목표 설정 단계부터 학생에게 '선택권(Voice and Choice)'을 부여하여 주도성을 강화해야 합니다.", m: "2022 기조 = 주도성 (OECD 교육 2030 핵심 키워드)" },
    { id: 49, topic: "생태전환교육", type: "short", q: "2022 개정 교육과정 구성의 중점 사항으로, 단순 환경보호를 넘어 기후위기 시대에 대응하여 인간과 자연의 공존을 추구하고 삶의 패러다임 전환을 도모하는 교육은?", accepted: ["생태전환교육", "생태전환", "환경교육"], a: "생태전환교육", exp: "범교과 학습 주제로 강력하게 권장되며, 모든 교과와 연계하여 통합적으로 다루어집니다.", tip: "지역 하천 수질 개선 프로젝트 등 학교-마을 연계(탈학문적) 프로젝트 수업의 훌륭한 주제로 '생태전환교육'을 제시하십시오.", m: "지속가능성 확보 = 생태전환교육" },
    { id: 50, topic: "고교학점제", type: "short", q: "고등학교에서 학생이 자신의 진로와 적성에 따라 다양한 과목을 선택 이수하고, 누적 학점이 기준에 도달하면 졸업을 인정받는 제도는?", accepted: ["고교학점제", "학점제"], a: "고교학점제", exp: "2025년부터 전면 도입(2026학년도 입시 등 대비 필수). 3년간 총 192학점(교과 174, 창체 18)을 이수해야 합니다.", tip: "과목 선택권 보장뿐만 아니라, 학업에 뒤처지는 학생이 없도록 '최소 성취수준 보장지도' 체제를 철저히 구축하는 것이 성공의 열쇠입니다.", m: "고교학점제 = 진로 맞춤형 선택 + 책임 교육" },
    { id: 51, topic: "공간 혁신", type: "short", q: "고교학점제 등 유연한 교육과정 운영을 위해 기존의 획일적 교실을 가변형, 다목적, 개방형 공간으로 재구조화하는 사업/개념은?", accepted: ["학교공간혁신", "공간혁신", "그린스마트미래학교", "공간조성"], a: "학교 공간 혁신 (공간 조성)", exp: "소수 선택과목, 프로젝트 수업, 공강 시간 휴식 등을 위해 물리적 환경 개선이 필수적으로 요구됩니다.", tip: "교육과정 재구성과 교수학습 방법의 혁신은 '유연한 학습 공간 혁신'이 물리적으로 뒷받침될 때 비로소 완성될 수 있습니다.", m: "고교학점제 필수 인프라 = 공간 혁신" },
    { id: 52, topic: "최소 성취수준 보장지도", type: "short", q: "고교학점제 하에서 기준 성취율(40%)에 도달하지 못한 미이수자(Incomplete)가 발생하지 않도록 학교가 예방 및 보충 지도를 하는 제도는?", accepted: ["최소성취수준보장지도", "최소성취수준보장", "보충이수", "책임교육"], a: "최소 성취수준 보장지도", exp: "기초 학력 보장과 공교육의 책무성을 실현하기 위한 학점제의 핵심 안전망입니다.", tip: "평가 결과 통보 후에만 실시하는 것이 아니라, 학기 중 AI 진단 도구를 활용하여 학력 결손을 '조기 발견'하고 예방적 지도를 병행해야 합니다.", m: "미이수 방지 안전망 = 최소 성취수준 보장지도" },
    { id: 53, topic: "맞춤형 학습", type: "multiple", q: "AI 등 에듀테크 기술을 활용하여 학생 개개인의 성취 수준, 학습 속도, 선호도에 최적화된 학습 경로와 콘텐츠를 제공하는 교수 방식은?", choices: ["맞춤형 학습", "일제식 수업", "표준화 교육", "형식도야"], accepted: ["맞춤형 학습"], a: "맞춤형(적응형) 학습 (Adaptive Learning)", exp: "데이터 기반으로 학습 결손을 실시간 파악하고 개별화된 스캐폴딩(비계)을 제공합니다.", tip: "기술이 교사를 대체하는 것이 아닙니다. 교사가 AI 대시보드를 활용해 '맞춤형 학습'을 디자인하고 정서적 멘토링을 강화하는 '하이터치 하이테크'가 요구됩니다.", m: "AI 에듀테크 = 개별화/맞춤형 학습(Adaptive)" },
    { id: 54, topic: "잠재적 교육과정 - 교사 역할", type: "short", q: "잠재적 교육과정의 형성에 결정적 영향을 미치는 교사의 특성 중, 교사의 말투, 태도, 편견 등이 학생에게 모델링되어 무의식적으로 내면화되는 효과는?", accepted: ["솔선수범", "교사의인격", "인격", "모범", "인격적모범"], a: "교사의 인격적 모범", exp: "학생은 교사가 명시적으로 가르치는 지식보다, 교사의 암묵적 태도와 인격을 더 깊이 학습합니다.", tip: "학생 상담이나 생활지도 시, 교사의 수용적이고 공감적인 태도 자체가 훌륭한 인성 교육의 잠재적 교육과정으로 작용함을 강조하세요.", m: "잠재적 = 교사는 학생의 거울" },
    { id: 55, topic: "영 교육과정 - 원인", type: "multiple", q: "다음 중 영 교육과정이 발생하는 원인으로 가장 거리가 먼 것은?", choices: ["국가나 집단의 정치적 이데올로기에 의한 배제", "평가(수능)에 나오지 않아 교사가 임의로 생략함", "수업 시수 부족 등 물리적 환경 제약으로 건너뜀", "학생이 주도적으로 심화 탐구하여 새로운 지식을 구성함"], accepted: ["학생이 주도적으로 심화 탐구하여 새로운 지식을 구성함"], a: "학생 주도적 심화 탐구", exp: "학생의 능동적 탐구는 배움의 긍정적 확장(생성형)이며, 누락/배제된 영 교육과정이 아닙니다.", tip: "교사는 무의식적인 관행이나 입시 위주 분위기 때문에 배제하고 있는 중요한 가치(영 교육과정)가 없는지 지속적으로 성찰해야 합니다.", m: "영 교육과정 원인 = 의도적 배제 OR 환경적 제약/무지" },
    { id: 56, topic: "형식도야론", type: "short", q: "교과중심 교육과정의 사상적 배경으로, 고전이나 수학 같은 전통 교과를 배우면 인간의 심리적 능력(이성, 기억력 등)이 근육처럼 단련된다는 심리학 이론은?", accepted: ["형식도야론", "형식도야", "능력심리학"], a: "형식도야론 (Formal Discipline)", exp: "실생활의 유용성보다는 정신의 도야 그 자체를 목적으로 하는 전통적 시각입니다.", tip: "현대 역량 중심 교육(실제적 맥락에서의 전이 중시)을 설명할 때, 과거 형식도야론적 시각의 한계를 비판하는 논리로 자주 쓰입니다.", m: "교과중심 배경 = 형식도야론 (마음의 근육 단련)" },
    { id: 57, topic: "상관형 교육과정", type: "multiple", q: "각 교과의 선(정체성)을 엄격히 유지하면서 공통되는 주제를 통해 교과 간의 관련성만을 맺어주는 소극적 통합 교육과정은?", choices: ["상관형 교육과정", "광역형 교육과정", "분과형 교육과정", "융합형 교육과정"], accepted: ["상관형 교육과정"], a: "상관형(Correlated) 교육과정", exp: "국어 시간에 '일제강점기 문학'을 배울 때 역사 시간 진도를 맞춰 '일제강점기 역사'를 가르치는 방식입니다.", tip: "현실적으로 교과 장벽이 높은 중등학교 현장에서 가장 진입 장벽이 낮게 시도해볼 수 있는 교과 융합 방식입니다.", m: "상관형 = 개별교과 유지 + 시기/주제 연결" },
    { id: 58, topic: "학문중심 교육과정 - 장점", type: "short", q: "학문중심 교육과정은 핵심 아이디어를 통해 학습 내용의 경제성을 높이고, 한 가지 원리를 배워 여러 새로운 상황에 적용할 수 있는 능력을 키웁니다. 이 능력을 무엇이라 합니까?", accepted: ["일반적전이", "전이", "학습의전이", "전이력"], a: "일반적 전이", exp: "지식의 폭발적 팽창 시대에 모든 사실을 가르칠 수 없으므로, 전이력이 높은 '지식의 구조'를 가르치는 것입니다.", tip: "빠르게 변하는 미래 사회의 불확실성에 대비하기 위해서는 파편적 지식 암기가 아닌, '핵심 아이디어(Big Idea)' 중심의 전이력 학습이 필수적입니다.", m: "학문중심 목표 = 일반적 전이 (지식 폭발 시대 대비)" },
    { id: 59, topic: "경험중심 교육과정 - 중핵", type: "short", q: "학생의 필요나 현대 사회의 중대한 문제를 중심에 두고 교육과정을 묶어 통합적 경험을 제공하는 '중핵 교육과정'은 어떤 교육과정 사조의 세부 조직 형태인가?", accepted: ["경험중심", "경험중심교육과정"], a: "경험중심 교육과정", exp: "진보주의 철학과 듀이의 사상에 바탕을 두고 실생활 문제 해결과 전인적 성장을 도모합니다.", tip: "다문화, 환경, 지역 격차 등 당면한 사회 문제를 중핵으로 삼는 공동체 역량 함양 수업 설계 시 이론적 배경으로 활용하세요.", m: "중핵 설계 = 경험중심 사조의 대표적 통합 형태" },
    { id: 60, topic: "간학문적 통합", type: "multiple", q: "드레이크의 통합 모형에서 학문 간 경계를 허물고 여러 교과의 '공통 부분(개념, 탐구방법 등)'을 추출하여 이를 중심으로 조직하는 방식은?", choices: ["다학문적 통합", "간학문적 통합", "탈학문적 통합", "광역형 통합"], accepted: ["간학문적 통합"], a: "간학문적 통합", exp: "다학문적(독립유지)과 탈학문적(완전초월)의 중간 형태로, 교과 간 공통 분모를 교집합으로 삼습니다.", tip: "과학기술과 예술을 융합하는 STEAM 교육 프로젝트를 설계할 때 간학문적 통합 접근이 매우 유효합니다.", m: "간학문적 = 공통 요소(개념/기능) 추출 결합" },
    { id: 61, topic: "수직적 조직 - 계속성", type: "short", q: "특정 지식이나 기능을 시간의 경과에 따라 폭과 깊이의 확대 없이 '동일한 수준으로 반복'하여 다루는 수직적 조직 원리는?", accepted: ["계속성", "계속성의원리"], a: "계속성 (Continuity)", exp: "망각을 방지하고 기초 기능이 완전히 숙달되도록 돕는 가장 기본적인 원리입니다.", tip: "디지털 기기 활용 기본 윤리나 협력적 태도 지도는 일회성 행사가 아니라 교육과정 전반에 걸쳐 계속성을 띠고 반복 지도되어야 합니다.", m: "계속성 = 동일 수준 반복 (망각 방지)" },
    { id: 62, topic: "수평적 조직 - 통합성", type: "short", q: "지식을 파편화하지 않고 하나의 의미 있는 전체로 이해할 수 있도록 교육과정 요소들을 횡적으로 밀접하게 연관 짓는 원리는?", accepted: ["통합성", "통합성의원리", "통합"], a: "통합성 (Integration)", exp: "학습 경험의 통일성을 기하여 실생활 문제에 대한 종합적 사고를 돕습니다.", tip: "주제 중심의 프로젝트 기반 학습(PBL)은 범교과적 쟁점을 통해 교육 내용의 '통합성'을 실현하는 가장 효과적인 수업 전략입니다.", m: "통합성 = 수평적 연결, 의미 있는 전체화" },
    { id: 63, topic: "타일러 평가관", type: "multiple", q: "타일러의 합리적 모형에서 평가는 궁극적으로 어떤 기준에 의해 이루어져야 한다고 보는가?", choices: ["학생 간의 상대적 서열(규준)", "사전에 설정된 교육목표의 달성 정도", "평가자의 주관적 직관", "국가 평균 학업성취도 통계"], accepted: ["사전에 설정된 교육목표의 달성 정도"], a: "교육목표 달성 정도", exp: "타일러는 목표-내용-평가의 일관성을 중시하는 '목표중심 평가(준거참조평가)'를 확립했습니다.", tip: "성취평가제(절대평가)의 타당성을 논할 때, '서열이 아닌 목표 도달 여부를 확인하여 피드백을 제공한다'는 타일러의 논리가 핵심 근거가 됩니다.", m: "타일러 평가 = 목표 달성 확인 (절대평가의 기원)" },
    { id: 64, topic: "타바 모형 - 처방적 성격", type: "short", q: "타바 모형은 교수학습 활동을 어떻게 전개할 것인지 구체적인 절차를 제시한다는 점에서 ( O O 적 ) 모형이라 불린다.", accepted: ["처방", "처방적"], a: "처방적 (Prescriptive) 모형", exp: "8단계 절차가 매우 세분화되어 있어 현장 교사가 수업을 설계할 때 그대로 따라할 수 있는 가이드(처방)를 제공합니다.", tip: "수업 전문성이 부족한 초임 교사를 지원하기 위해 타바의 처방적 단원 개발 모형을 PLC(전문적학습공동체) 연수 프로토콜로 활용할 수 있습니다.", m: "타바 특징 = 처방적 (구체적 지침서 역할)" },

// --- 상태 관리 (Canvas Iframe 샌드박스 완벽 대응) ---
let questions = [];
let filteredQuestions = [];
let currentQuestionIndex = 0;
let currentTab = 'all'; 

// ★ Canvas (IFrame) 환경 완벽 호환 안전한 스토리지 (메모리 + LocalStorage Fallback)
let memoryNotes = [];
function loadNotesSafely() {
    try {
        const saved = localStorage.getItem('eduQuiz2026_V2_Incorrect');
        if (saved) {
            memoryNotes = JSON.parse(saved);
            return memoryNotes;
        }
    } catch (error) {
        console.warn('Canvas 환경 보안으로 메모리 스토리지를 사용합니다.');
    }
    return memoryNotes;
}

function saveNotesSafely(notes) {
    memoryNotes = notes; // 메모리 우선 저장 (Iframe 크래시 방지)
    try {
        localStorage.setItem('eduQuiz2026_V2_Incorrect', JSON.stringify(notes));
    } catch (error) {
        // 브라우저 보안 차단 시 조용히 무시 (앱은 정상 작동 유지)
    }
}

let incorrectNotes = loadNotesSafely();

// DOM 요소 매핑
const els = {
    tabs: document.getElementById('tabs'),
    qTypeBadge: document.getElementById('q-type-badge'),
    qProgress: document.getElementById('q-progress'),
    qText: document.getElementById('q-text'),

    mainContent: document.getElementById('main-content')
};

// 유틸리티
const shuffle = (array) => {
    let curr = array.length, rand;
    while (curr !== 0) {
        rand = Math.floor(Math.random() * curr);
        curr--;
        [array[curr], array[rand]] = [array[rand], array[curr]];
    }
    return array;
};

// 지능형 정규화 (공백, 기호 제거, 소문자화)
const normalizeText = (text) => {
    return text.replace(/[\s~`!@#$%^&*()_+\-={[}\]|\\:;"'<,>.?/]/g, '').toLowerCase();
};

function initApp() {
    setupData();
    renderTabs();
    loadQuestions('all');
    setupEventListeners();
}

function setupData() {
    questions = shuffle([...rawData]);
    questions.forEach(q => {
        if (q.type === 'multiple' && q.choices) q.choices = shuffle([...q.choices]);
    });
}

function renderTabs() {
    const tabsData = [
        { id: 'all', label: '전체 (75문항)' },
        { id: 'short', label: '단답형 집중' },
        { id: 'multiple', label: '객관식 집중' },
        { id: 'incorrect', label: '오답 노트', badge: incorrectNotes.length }
    ];

    els.tabs.innerHTML = tabsData.map(tab => {
        const isActive = currentTab === tab.id;
        const colorClass = isActive ? "text-indigo-700 border-indigo-600 bg-indigo-50/50" : "text-gray-500 border-transparent hover:text-indigo-500 hover:bg-gray-50";
        const badgeHTML = tab.badge > 0 ? `<span class="absolute top-1 right-2 bg-pink-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">${tab.badge}</span>` : '';
        
        return `<div class="px-5 py-3 font-extrabold text-[15px] whitespace-nowrap transition-all duration-200 border-b-[3px] relative cursor-pointer rounded-t-xl ${colorClass}" data-tab="${tab.id}">${tab.label} ${badgeHTML}</div>`;
    }).join('');
}

function loadQuestions(tabId) {
    currentTab = tabId;
    renderTabs();
    currentQuestionIndex = 0;

    if (tabId === 'all') filteredQuestions = shuffle([...questions]);
    else if (tabId === 'short') filteredQuestions = shuffle(questions.filter(q => q.type === 'short'));
    else if (tabId === 'multiple') filteredQuestions = shuffle(questions.filter(q => q.type === 'multiple'));
    else if (tabId === 'incorrect') {
        const incIds = incorrectNotes.map(n => n.id);
        filteredQuestions = shuffle(questions.filter(q => incIds.includes(q.id)));
    }

    if (filteredQuestions.length === 0) showEmptyState();
    else renderQuestion();
}

function showEmptyState() {
    els.qTypeBadge.textContent = "INFO";
    els.qProgress.textContent = "Clear";
    els.qText.innerHTML = `<div class="text-center py-10"><span class="text-3xl mb-4 block">🎉</span><span class="text-gray-500 font-bold">오답이 없거나 모든 학습을 완료했습니다!<br>위 탭을 눌러 다시 시작해보세요.</span></div>`;
    els.inputArea.innerHTML = "";
    els.feedbackArea.classList.add('hidden');
    els.feedbackArea.classList.remove('flex', 'animate-fade-in');
    els.actionBtn.textContent = "처음으로 돌아가기";
    els.actionBtn.onclick = () => loadQuestions('all');
}

let selectedMcqAns = "";

function renderQuestion() {
    els.feedbackArea.classList.add('hidden');
    els.feedbackArea.classList.remove('flex', 'animate-fade-in');
    els.mainContent.scrollTo({ top: 0, behavior: 'smooth' });
    
    const q = filteredQuestions[currentQuestionIndex];
    els.qTypeBadge.textContent = q.type === 'short' ? '✏️ 단답/기입형' : '✅ 4지선다형';
    els.qProgress.textContent = `${q.topic} | ${currentQuestionIndex + 1} / ${filteredQuestions.length}`;
    els.qText.textContent = q.q;

    els.actionBtn.textContent = "정답 확인하기";
    els.actionBtn.classList.remove('from-emerald-500', 'to-teal-600'); 
    els.actionBtn.onclick = checkAnswer;

    if (q.type === 'short') {
        els.inputArea.innerHTML = `
            <input type="text" id="short-input" 
                class="w-full p-5 rounded-2xl border-[3px] border-gray-100 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100/50 outline-none text-xl font-bold transition-all bg-white shadow-sm text-gray-800"
                placeholder="여기에 정답을 입력하세요" autocomplete="off">
        `;
        setTimeout(() => document.getElementById('short-input').focus(), 50);
    } else {
        selectedMcqAns = "";
        els.inputArea.innerHTML = q.choices.map((choice, idx) => `
            <div class="mcq-option p-4 mb-3 border-2 border-gray-100 rounded-2xl cursor-pointer bg-white shadow-sm flex items-center gap-4 text-[1.1rem] font-medium text-gray-700" data-ans="${choice}">
                <span class="w-9 h-9 rounded-full bg-gray-50 border border-gray-200 text-gray-400 flex items-center justify-center font-black text-sm pointer-events-none">${idx+1}</span>
                <span class="pointer-events-none flex-1 break-keep">${choice}</span>
            </div>
        `).join('');
        
        document.querySelectorAll('.mcq-option').forEach(el => {
            el.addEventListener('click', (e) => {
                document.querySelectorAll('.mcq-option').forEach(opt => opt.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                selectedMcqAns = e.currentTarget.getAttribute('data-ans');
            });
        });
    }
}

function checkAnswer() {
    const q = filteredQuestions[currentQuestionIndex];
    let isCorrect = false;

    if (q.type === 'short') {
        const inputEl = document.getElementById('short-input');
        const userAnswer = inputEl.value;
        if (!userAnswer.trim()) {
            inputEl.classList.add('border-pink-300', 'bg-pink-50');
            setTimeout(() => inputEl.classList.remove('border-pink-300', 'bg-pink-50'), 400);
            return;
        }
        isCorrect = q.accepted.some(ans => normalizeText(ans) === normalizeText(userAnswer));
        inputEl.disabled = true;
    } else {
        if (!selectedMcqAns) {
            const options = document.querySelectorAll('.mcq-option');
            options.forEach(opt => { opt.style.transform = 'translateX(5px)'; setTimeout(()=> opt.style.transform='', 100); });
            return; 
        }
        isCorrect = q.accepted.includes(selectedMcqAns);
        document.querySelectorAll('.mcq-option').forEach(el => {
            el.style.pointerEvents = 'none'; 
            if(q.accepted.includes(el.getAttribute('data-ans'))) {
                el.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-700', 'font-bold'); 
            } else if (el.classList.contains('selected') && !isCorrect) {
                el.classList.add('border-pink-400', 'bg-pink-50', 'text-pink-700'); 
            }
        });
    }

    if (!isCorrect) {
        if (!incorrectNotes.find(n => n.id === q.id)) {
            incorrectNotes.push(q);
            saveNotesSafely(incorrectNotes);
            renderTabs(); 
        }
    } else {
        if(currentTab === 'incorrect') {
            incorrectNotes = incorrectNotes.filter(n => n.id !== q.id);
            saveNotesSafely(incorrectNotes);
            renderTabs();
        }
    }

    showFeedback(isCorrect, q);
}

function showFeedback(isCorrect, q) {
    els.feedbackArea.classList.remove('hidden');
    els.feedbackArea.classList.add('flex', 'animate-fade-in'); 
    
    if(isCorrect) {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200`;
        els.fbAlert.innerHTML = `🎉 완벽합니다! 정답입니다.`;
    } else {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-pink-100 text-pink-800 shadow-sm border border-pink-200`;
        els.fbAlert.innerHTML = `💡 아쉽습니다. 공식 정답은 <span class="text-pink-600 text-xl">[ ${q.a} ]</span> 입니다.`;
    }

    els.fbExp.innerHTML = q.exp;
    els.fbM.innerHTML = q.m;
    els.fbTip.innerHTML = q.tip;

    els.actionBtn.textContent = "다음 문제로 이동 (Enter ⏎)";
    els.actionBtn.classList.add('from-emerald-500', 'to-teal-600');
    els.actionBtn.onclick = nextQuestion;
    
    setTimeout(() => {
        els.mainContent.scrollTo({ top: els.mainContent.scrollHeight, behavior: 'smooth' });
    }, 150);
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < filteredQuestions.length) {
        renderQuestion();
    } else {
        showEmptyState();
        els.qText.innerHTML = `<span class="text-indigo-600">수고하셨습니다! 해당 파트의 모든 훈련을 완료했습니다. 🚀</span>`;
    }
}

function setupEventListeners() {
    els.tabs.addEventListener('click', (e) => {
        const tabEl = e.target.closest('[data-tab]');
        if (tabEl) loadQuestions(tabEl.getAttribute('data-tab'));
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            if (els.actionBtn.textContent.includes('다음')) nextQuestion();
            else checkAnswer();
        }
    });
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
