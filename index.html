  <style>

      padding: 0;

    body {

      color: #1e293b;

      display: flex;
      flex-direction: column;
    }
    header {

    }

      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      background: #f59e0b;
      color: #1e1b4b;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: -0.5px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .controls-bar {

      align-items: center;

    }
    .btn-top {

      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-top:hover {
      background-color: rgba(255, 255, 255, 0.32);
    }
    main {
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* 필터 탭 바 */
    .filter-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 3px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-tabs::-webkit-scrollbar {
      height: 4px;
    }
    .filter-tabs::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .filter-btn {
      background: white;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }
    .filter-btn:hover {
      border-color: #6366f1;
      color: #312e81;
    }
    .filter-btn.active {
      background: #3730a3;
      color: white;
      border-color: #3730a3;
      box-shadow: 0 1px 3px rgba(55, 48, 163, 0.25);
    }
    .filter-btn.special-tab {
      background: #fffbeb;
      border-color: #fcd34d;
      color: #92400e;
    }
    .filter-btn.special-tab.active {
      background: #d97706;
      border-color: #d97706;
      color: white;
    }
    /* 상단 상태창 */
    .status-panel {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      flex-wrap: wrap;
      gap: 6px;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .type-badge.short {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .type-badge.choice {
      background-color: #e0e7ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }
    .category-tag {
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      width: 0%;
      transition: width 0.3s ease;
    }
    /* 문제 카드 */
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .question-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.58;
      color: #0f172a;
    }
    .q-num {
      color: #3730a3;
      font-weight: 800;
      margin-right: 4px;
    }
    /* 객관식 보기 영역 */

      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .option-btn {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      font-size: 13.5px;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
      line-height: 1.45;
    }
    .option-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }
    .option-prefix {
      color: #4f46e5;
      font-weight: 800;
      flex-shrink: 0;
    }
    .option-btn.correct {
      background: #f0fdf4 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: 700;
    }
    .option-btn.wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
      font-weight: 700;
    }

    .short-input-zone {

      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
    }
    .short-input-row {
      display: flex;
      gap: 8px;
    }
    .short-input {
      flex: 1;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .short-input:focus {
      border-color: #3730a3;
      box-shadow: 0 0 0 3px rgba(55, 48, 163, 0.15);
    }
    .short-input:disabled {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-submit-short {
      background: #3730a3;
      color: white;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-submit-short:hover {
      background: #1e1b4b;
    }
    .short-guide-text {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* 피드백/해설/논술 모범문장 박스 */
    .feedback-card {
      display: none;
      border-radius: 12px;
      padding: 14px;
      animation: fadeIn 0.2s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .feedback-card.is-correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .feedback-card.is-wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .feedback-header {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feedback-body {
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
      border: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .essay-box {
      background: #eff6ff;
      border-left: 3.5px solid #2563eb;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12.5px;
      color: #1e40af;
      line-height: 1.5;
    }
    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .btn-next {
      background: #3730a3;
      color: white;
      border: none;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(55, 48, 163, 0.25);
      transition: 0.15s;
    }
    .btn-next:hover {
      background: #1e1b4b;
    }
    /* 결과 화면 */
    .result-view {
      display: none;
      text-align: center;
      padding: 26px 18px;
      gap: 14px;
    }
    .score-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #eef2ff;
      color: #3730a3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      margin: 0 auto;
      border: 4px solid #c7d2fe;
    }
    .stat-boxes {
      display: grid;

      margin: 10px 0;
    }
    .stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 9px;
      border-radius: 9px;
    }
    .stat-val {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .stat-lbl {
      font-size: 11px;
      color: #64748b;
    }
    .review-list {
      text-align: left;
      max-height: 280px;
      overflow-y: auto;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .review-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.48;
    }
    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->

    function normalizeStr(str) {
      if (!str) return '';
      return str.toString()
        .toLowerCase()
        .replace(/[\s\-_,·•\(\)\[\]\/]/g, '')
        .trim();
    }

    // Fisher-Yates 무작위 셔플
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initQuiz(filterKey) {

      } else if (filterKey === 'type-choice') {
        pool = masterDB.filter(item => item.type === 'choice');

          const original = item.options.map((t, i) => ({ text: t, isAns: i === item.answer }));

        shortBox.style.display = 'flex';
        shortInput.disabled = false;
        shortInput.value = '';
        shortInput.focus();
      }
    }

    // 객관식 정답 검증
    function checkChoiceAnswer(selectedIdx) {
      if (isAnswered) return;
      isAnswered = true;

      const q = activeList[curIdx];
      const isCorrect = (selectedIdx === q.answer);
      const allBtns = document.getElementById('options-box').querySelectorAll('.option-btn');

      allBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        } else if (idx === selectedIdx) {
          btn.classList.add('wrong');
        }
      });

      showFeedback(isCorrect, q.options[q.answer]);
    }

    // 단답형 정답 검증
    function checkShortAnswer() {
      if (isAnswered) return;
      const shortInput = document.getElementById('short-input');
      const userInput = shortInput.value.trim();

      if (!userInput) {
        alert('답안을 입력해주세요!');
        shortInput.focus();
        return;
      }

      isAnswered = true;
      shortInput.disabled = true;

      const q = activeList[curIdx];
      const normUser = normalizeStr(userInput);
      const isCorrect = q.validAnswers.some(ans => normalizeStr(ans) === normUser);

      showFeedback(isCorrect, q.validAnswers[0]);
    }

    // 공통 피드백 출력 (논술 모범 답안 문장 포함)
    function showFeedback(isCorrect, displayAnswer) {
      const q = activeList[curIdx];
      const feedbackBox = document.getElementById('feedback-box');
      const feedbackHeader = document.getElementById('feedback-header');
      const feedbackBody = document.getElementById('feedback-body');

      feedbackBox.style.display = 'block';

      if (isCorrect) {
        score++;
        document.getElementById('score-text').innerText = score;
        feedbackBox.className = 'feedback-card is-correct';
        feedbackHeader.innerHTML = '✔ 정답입니다! 정확하고 신속하게 인출되었습니다.';
      } else {
        feedbackBox.className = 'feedback-card is-wrong';
        feedbackHeader.innerHTML = '✖ 오답입니다! 핵심 키워드와 논술 문장을 복습하세요.';

        if (!wrongBank.includes(q.id)) {
          wrongBank.push(q.id);
          updateWrongBadge();
        }
      }

      feedbackBody.innerHTML = `
        <div style="font-weight: 700; color: #0f172a;">
          정답 키워드: <span style="color: #3730a3; font-weight: 800;">${displayAnswer}</span>
        </div>
        <div style="font-size: 12.5px; color: #475569;">
          <b style="color: #b45309;">💡 암기 팁 & 두문자:</b> ${q.tip}
        </div>
        <div class="essay-box">
          <div style="font-weight: 800; margin-bottom: 2px;">✍ [교육학 논술 서술 모범 문장]:</div>
          <div>${q.essayTip}</div>
        </div>
      `;
    }

    // 단답형 엔터키 및 클릭 이벤트
    document.getElementById('btn-submit-short').onclick = checkShortAnswer;
    document.getElementById('short-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!isAnswered) {
          checkShortAnswer();
        } else {
          document.getElementById('btn-next').click();
        }
      }
    });

    // 다음 문제 이동
    document.getElementById('btn-next').onclick = () => {
      if (curIdx < activeList.length - 1) {
        curIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    };

    function updateWrongBadge() {
      document.getElementById('btn-wrong-tab').innerText = `오답노트 (${wrongBank.length})`;
    }

    // 결과 화면
    function showResults() {
      document.getElementById('status-panel').style.display = 'none';
      document.getElementById('quiz-card').style.display = 'none';
      document.getElementById('result-card').style.display = 'flex';

      const total = activeList.length;
      const pct = Math.round((score / total) * 100);

      document.getElementById('res-score-badge').innerText = `${pct}%`;
      document.getElementById('res-total').innerText = total;
      document.getElementById('res-correct').innerText = score;
      document.getElementById('res-wrong').innerText = total - score;

      const heading = document.getElementById('res-heading');
      const desc = document.getElementById('res-desc');

      if (pct >= 90) {
        heading.innerText = '논술 인출 최상위권 달성! 🏆';
        desc.innerText = '단답형 키워드와 핵심 이론의 개념 구조가 완벽하게 정립되어 있습니다.';
      } else if (pct >= 70) {
        heading.innerText = '우수한 인출 실력! 👏';
        desc.innerText = '틀린 단답형 키워드와 논술 모범 서술 문장만 2~3회 정독하면 만점권입니다.';
      } else {
        heading.innerText = '반복 쓰기 훈련이 필요합니다! 💪';
        desc.innerText = '오답노트 및 [논술 단답형만] 탭을 활용하여 키워드를 직접 타이핑하며 외우세요.';
      }

      // 오답 목록 렌더링
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';
      const failed = activeList.filter(item => wrongBank.includes(item.id));

      if (failed.length === 0) {
        reviewList.innerHTML = '<div style="text-align:center; padding:12px; color:#16a34a; font-weight:700;">틀린 문제가 없습니다! 완벽한 인출입니다. 🎉</div>';
      } else {
        failed.forEach(item => {
          const div = document.createElement('div');
          div.className = 'review-item';
          const answerText = item.type === 'choice' ? item.options[item.answer] : item.validAnswers[0];
          div.innerHTML = `
            <div style="font-weight:700; color:#0f172a; margin-bottom:2px;">[${item.type === 'short' ? '단답' : '객관식'}·${item.category}] ${item.q}</div>
            <div style="color:#15803d; font-weight:700;">정답: ${answerText}</div>
            <div style="color:#1e40af; font-size:11.5px; margin-top:3px; background:#eff6ff; padding:4px 6px; border-radius:4px;">
              <b>논술 문장:</b> ${item.essayTip}
            </div>
          `;
          reviewList.appendChild(div);
        });
      }
    }

    // 탭 전환 핸들러
    function setFilterActive(key) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-filter') === key) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        const key = btn.getAttribute('data-filter');
        setFilterActive(key);
        initQuiz(key);
      };
    });

    document.getElementById('btn-shuffle').onclick = () => initQuiz(currentFilter);
    document.getElementById('btn-restart-all').onclick = () => {
      setFilterActive('all');
      initQuiz('all');
    };
    document.getElementById('btn-restart-wrong').onclick = () => {
      setFilterActive('wrong');
      initQuiz('wrong');
    };

    // DOM 로드 즉시 실행
    window.addEventListener('DOMContentLoaded', () => {
      initQuiz('all');
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initQuiz('all');
    }
  </script>
</body>
</html>
