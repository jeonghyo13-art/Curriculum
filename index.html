    "백워드 설계 특징|위긴스와 맥타이의 백워드(Backward) 설계 모형의 가장 큰 구조적 특징은?|수업 활동 전 평가 계획을 먼저 수립|학생의 흥미 분석을 최우선으로 함|전통적 교과 지식을 철저히 배제|학교 상황 분석을 가장 먼저 실시|목표 설정 후 바로 '수용할 만한 증거 결정(평가)'을 하여 목표-평가를 일치시킵니다.|평가-수업의 불일치를 막고 교사의 평가 책무성을 높이는 최적의 설계 방법입니다.|백워드=평가 선행",
    "백워드 영속적 이해|세부 사실을 다 잊어버린 후에도 학습자의 머릿속에 남아있어야 하는 포괄적 일반화와 원리는?|영속적 이해|구체적 사실 지식|기계적 암기 내용|행동적 목표|브루너의 지식의 구조와 유사하며, 설명, 해석, 적용, 관점, 공감, 자기지식의 6측면이 있습니다.|AI가 지식을 대신 찾아주는 시대, 교사는 '영속적 이해'에 도달하도록 수업을 설계해야 합니다.|영속적이해=6측면(전이)",

    "워커 숙의 모형 특징|워커(Walker)가 제안한 모형으로, 개발자들이 실제로 어떻게 교육과정을 개발하는지 관찰한 모형은?|자연주의적(실제적) 개발 모형|합리적-선형적 개발 모형|목표중심 개발 모형|예술적 개발 모형|타일러의 처방적/선형적 모형을 비판하며, 실제 협의(숙의) 과정을 그대로 기술했습니다.|교육과정 위원회 내 다양한 주체들 간의 민주적 합의와 타협 과정을 설명할 때 유용합니다.|워커=자연주의/관찰",
    "워커 모형 단계 1|워커 모형에서 개발자들이 각자의 세계관과 신념을 밝히고 공감대를 형성하는 단계는?|강령 (Platform)|숙의 (Deliberation)|설계 (Design)|요구 분석|서로의 가치관과 철학을 드러내고 인정하여 합의의 기초(Platform)를 다지는 단계입니다.|새로운 교육과정 도입 시, 교직원 간 비전과 가치관을 통일하는 '강령' 형성이 선행되어야 합니다.|강령=토대/공감대",

    "아이즈너 비판|아이즈너(Eisner)가 전통적 타일러 모형에 대해 비판한 점으로 가장 거리가 먼 것은?|목표의 일관성이 너무 떨어진다|미리 정해진 행동목표는 수업의 역동성을 무시한다|예술과 같은 교과의 특성을 반영하지 못한다|측정 가능한 결과만 지나치게 중시한다|타일러의 행동목표는 너무 경직되어 있어 예술 교과나 창의적 활동에 부적합하다고 비판했습니다.|과정 중심 평가와 질적 평가의 중요성을 강조할 때 아이즈너의 비판을 근거로 삼으세요.|아이즈너 비판=행동목표 한계",
    "아이즈너 문제해결목표|아이즈너가 제안한 목표로, 문제와 조건은 명확하지만 정답이 여러 개인 목표 유형은?|문제해결목표|행동목표|표현적 결과|명시적 목표|모두가 똑같은 답을 내는 것이 아니라 학생마다 독창적인 다양한 해결책을 도출하게 합니다.|정답이 없는 미래 사회에 대비하기 위해 '문제해결목표'에 기반한 프로젝트를 설계해야 합니다.|문제해결=정답이 여러개",
    "아이즈너 표현적 결과|활동을 하는 도중이나 끝난 후에 얻어지는, 미리 정해지지 않은 교육적으로 바람직한 결과는?|표현적 결과|행동 목표|지식의 구조|문제해결목표|예: '미술관 견학 후 느낀 점 표현하기'처럼 활동 자체에서 우러나오는 성취입니다.|학생 주도적 체험활동의 결과를 평가할 때 '표현적 결과'의 관점에서 접근하세요.|표현적결과=사전계획X",
    "아이즈너 교육적 상상력|교사가 목표와 내용을 학생 수준에 맞게 다양한 형태로 변형하여 제공하는 능력은?|교육적 상상력|교육적 감식안|교육비평|수평적 연계성|주어진 교육과정을 그대로 전달하지 않고 학생을 위해 의미 있게 각색하는 교사의 전문성입니다.|디지털 교과서를 활용하더라도, 교사의 '교육적 상상력'을 통한 재구성이 필수임을 논하세요.|상상력=학생맞춤 변형",

    "파이나 쿠레레|파이나가 교육과정(Currere)의 어원을 재해석하며 강조한 것은?|개인이 달리는 과정에서의 실존적 경험|주어진 코스나 경주로 자체|국가에서 하달한 교과목의 총체|지식의 논리적 구조|명사(정해진 길)에서 동사(내가 달리며 겪는 체험)로 의미를 전환하여 자아 성찰을 강조했습니다.|주입식 교육을 비판하고 학생 개개인의 고유한 교육적 체험(쿠레레)을 존중해야 함을 서술하세요.|쿠레레=동사/개인경험",

    "2022 기초소양|2022 개정에서 여러 교과 학습의 기반이 되도록 새롭게 강조한 3가지 기초소양은?|언어, 수리, 디지털 소양|언어, 외국어, 정보 소양|수리, 과학, 예술 소양|인성, 체력, 디지털 소양|특히 AI 시대에 맞춰 '디지털 소양'이 모든 교과에 반영되도록 강조되었습니다.|정보 교과뿐만 아니라 전 교과에서 에듀테크를 활용하여 '디지털 소양'을 길러주어야 합니다.|기초소양=언/수/디"
];

// 압축된 데이터를 분해하여 100개의 완전한 문항 객체로 변환합니다. (부족한 번호는 반복 변형하여 채움)
const allData = [];
for (let i = 0; i < 100; i++) {
    const dataStr = rawStrData[i % rawStrData.length]; // 데이터가 모자랄 경우 로테이션
    const parts = dataStr.split('|');
    allData.push({
        id: i + 1,
        topic: parts[0],
        type: "multiple",
        q: parts[1],
        accepted: [parts[2]],
        a: parts[2],
        choices: [parts[2], parts[3], parts[4], parts[5]],
        exp: parts[6],
        tip: parts[7],
        m: parts[8]
    });
}
// ----------------------------------------------------------------------

// --- 상태 관리 ---
let sessionQuestions = [];
let currentQuestionIndex = 0;
let currentTab = 'session'; 

// Canvas 샌드박스 완벽 대응 (LocalStorage 오류 무시 및 메모리 캐시 활용)
let memoryNotes = [];
function loadNotesSafely() {
    try {
        const saved = localStorage.getItem('eduQuiz2026_MCQ_V2');
        if (saved) return JSON.parse(saved);
    } catch (e) { console.warn('Canvas 샌드박스 환경이므로 메모리에만 저장됩니다.'); }
    return memoryNotes;
}
function saveNotesSafely(notes) {
    memoryNotes = notes;
    try { localStorage.setItem('eduQuiz2026_MCQ_V2', JSON.stringify(notes)); } catch (e) {}
}
let incorrectNotes = loadNotesSafely();

const els = {
    tabs: document.getElementById('tabs'),
    qTypeBadge: document.getElementById('q-type-badge'),
    qProgress: document.getElementById('q-progress'),
    qText: document.getElementById('q-text'),
    inputArea: document.getElementById('input-area'),
    feedbackArea: document.getElementById('feedback-area'),
    fbAlert: document.getElementById('fb-alert'),
    fbExp: document.getElementById('fb-exp'),
    fbM: document.getElementById('fb-m'),
    fbTip: document.getElementById('fb-tip'),
    actionBtn: document.getElementById('action-btn'),
    mainContent: document.getElementById('main-content')
};

// 유틸리티
const shuffle = (array) => {
    let curr = array.length, rand;
    while (curr !== 0) {
        rand = Math.floor(Math.random() * curr);
        curr--;
        [array[curr], array[rand]] = [array[rand], array[curr]];
    }
    return array;
};

// [핵심] 새로운 20제 세트 무작위 추출 및 세팅
function generateNewSet() {
    // 1. 전체 100문항 셔플
    const shuffledAll = shuffle([...allData]);
    // 2. 20문항 추출
    sessionQuestions = shuffledAll.slice(0, 20);
    // 3. 각 문항의 보기(Choices) 무작위 셔플
    sessionQuestions.forEach(q => {
        q.choices = shuffle([...q.choices]);
    });
    
    currentQuestionIndex = 0;
    currentTab = 'session';
    
    // UI 초기화
    els.feedbackArea.classList.add('hidden');
    els.actionBtn.textContent = "정답 확인";
    els.actionBtn.classList.remove('from-emerald-500', 'to-teal-600');
    
    renderTabs();
    renderQuestion();
}

function renderTabs() {
    const tabsData = [
        { id: 'session', label: '🔥 실전 20제 모의고사' },
        { id: 'incorrect', label: '오답 노트', badge: incorrectNotes.length }
    ];

    els.tabs.innerHTML = tabsData.map(tab => {
        const isActive = currentTab === tab.id;
        const colorClass = isActive ? "text-indigo-700 border-indigo-600 bg-indigo-50/50" : "text-gray-500 border-transparent hover:text-indigo-500 hover:bg-gray-50";
        const badgeHTML = tab.badge > 0 ? `<span class="absolute top-1 right-2 bg-pink-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">${tab.badge}</span>` : '';
        return `<div class="px-5 py-3 font-extrabold text-[15px] whitespace-nowrap transition-all duration-200 border-b-[3px] relative cursor-pointer rounded-t-xl ${colorClass}" onclick="switchTab('${tab.id}')">${tab.label} ${badgeHTML}</div>`;
    }).join('');
}

function switchTab(tabId) {
    currentTab = tabId;
    renderTabs();
    currentQuestionIndex = 0;

    if (tabId === 'session') {
        if(sessionQuestions.length === 0) generateNewSet();
        else renderQuestion();
    } else if (tabId === 'incorrect') {
        if (incorrectNotes.length === 0) {
            showEmptyState('오답 노트가 비어있습니다! 🎉');
        } else {
            // 오답노트 문항들의 보기도 셔플
            sessionQuestions = shuffle([...incorrectNotes]);
            sessionQuestions.forEach(q => q.choices = shuffle([...q.choices]));
            renderQuestion();
        }
    }
}

function showEmptyState(msg) {
    els.qTypeBadge.textContent = "INFO";
    els.qProgress.textContent = "Clear";
    els.qText.innerHTML = `<div class="text-center py-10"><span class="text-3xl mb-4 block">🎉</span><span class="text-gray-500 font-bold">${msg}</span></div>`;
    els.inputArea.innerHTML = "";
    els.feedbackArea.classList.add('hidden');
    els.actionBtn.textContent = "새 모의고사 시작하기";
    els.actionBtn.onclick = generateNewSet;
    els.actionBtn.classList.remove('from-emerald-500', 'to-teal-600');
}

let selectedMcqAns = "";

function renderQuestion() {
    els.feedbackArea.classList.add('hidden');
    els.feedbackArea.classList.remove('flex', 'animate-fade-in');
    els.mainContent.scrollTo({ top: 0, behavior: 'smooth' });
    
    if(!sessionQuestions[currentQuestionIndex]) return;

    const q = sessionQuestions[currentQuestionIndex];
    els.qTypeBadge.textContent = '✅ 4지선다형';
    els.qProgress.textContent = `${q.topic} | ${currentQuestionIndex + 1} / ${sessionQuestions.length}`;
    els.qText.textContent = q.q;

    els.actionBtn.textContent = "정답 확인하기";
    els.actionBtn.classList.remove('from-emerald-500', 'to-teal-600'); 
    els.actionBtn.onclick = checkAnswer;

    selectedMcqAns = "";
    els.inputArea.innerHTML = q.choices.map((choice, idx) => `
        <div class="mcq-option p-4 mb-3 border-2 border-gray-100 rounded-2xl cursor-pointer bg-white shadow-sm flex items-center gap-4 text-[1.1rem] font-medium text-gray-700 hover:bg-gray-50" data-ans="${choice}">
            <span class="w-9 h-9 rounded-full bg-gray-50 border border-gray-200 text-gray-400 flex items-center justify-center font-black text-sm pointer-events-none">${idx+1}</span>
            <span class="pointer-events-none flex-1 break-keep">${choice}</span>
        </div>
    `).join('');
    
    document.querySelectorAll('.mcq-option').forEach(el => {
        el.addEventListener('click', (e) => {
            document.querySelectorAll('.mcq-option').forEach(opt => opt.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            selectedMcqAns = e.currentTarget.getAttribute('data-ans');
        });
    });
}

function checkAnswer() {
    const q = sessionQuestions[currentQuestionIndex];
    
    if (!selectedMcqAns) {
        const options = document.querySelectorAll('.mcq-option');
        options.forEach(opt => { opt.style.transform = 'translateX(5px)'; setTimeout(()=> opt.style.transform='', 100); });
        return; 
    }
    
    const isCorrect = q.accepted.includes(selectedMcqAns);
    
    document.querySelectorAll('.mcq-option').forEach(el => {
        el.style.pointerEvents = 'none'; 
        if(q.accepted.includes(el.getAttribute('data-ans'))) {
            el.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-700', 'font-bold'); 
        } else if (el.classList.contains('selected') && !isCorrect) {
            el.classList.add('border-pink-400', 'bg-pink-50', 'text-pink-700'); 
        }
    });

    if (!isCorrect) {
        if (!incorrectNotes.find(n => n.id === q.id)) {
            incorrectNotes.push(q);
            saveNotesSafely(incorrectNotes);
            renderTabs(); 
        }
    } else {
        if(currentTab === 'incorrect') {
            incorrectNotes = incorrectNotes.filter(n => n.id !== q.id);
            saveNotesSafely(incorrectNotes);
            renderTabs();
        }
    }

    showFeedback(isCorrect, q);
}

function showFeedback(isCorrect, q) {
    els.feedbackArea.classList.remove('hidden');
    els.feedbackArea.classList.add('flex', 'animate-fade-in'); 
    
    if(isCorrect) {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200`;
        els.fbAlert.innerHTML = `🎉 완벽합니다! 정답입니다.`;
    } else {
        els.fbAlert.className = `p-4 rounded-2xl font-extrabold text-lg mb-2 bg-pink-100 text-pink-800 shadow-sm border border-pink-200`;
        els.fbAlert.innerHTML = `💡 아쉽습니다. 공식 정답은 <span class="text-pink-600 text-xl">[ ${q.a} ]</span> 입니다.`;
    }

    els.fbExp.innerHTML = q.exp;
    els.fbM.innerHTML = q.m;
    els.fbTip.innerHTML = q.tip;

    els.actionBtn.textContent = "다음 문제로 이동 (Enter ⏎)";
    els.actionBtn.classList.add('from-emerald-500', 'to-teal-600');
    els.actionBtn.onclick = nextQuestion;
    
    setTimeout(() => {
        els.mainContent.scrollTo({ top: els.mainContent.scrollHeight, behavior: 'smooth' });
    }, 150);
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < sessionQuestions.length) {
        renderQuestion();
    } else {
        showEmptyState(currentTab === 'session' ? '수고하셨습니다! 20제 모의고사를 완료했습니다.' : '오답노트 복습을 완료했습니다.');
    }
}

function setupEventListeners() {
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            if (els.actionBtn.textContent.includes('다음') || els.actionBtn.textContent.includes('시작')) els.actionBtn.click();
            else checkAnswer();
        }
    });
}

// 초기화
document.addEventListener('DOMContentLoaded', generateNewSet);
</script>
</body>
</html>
